<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>김현미 · 디지털 명함</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --main: #FCAF17;
      --accent: #22201E;
      --accent-text: #D98200;
      --accent-soft: #FFF8E1;
      --bg-page: #FFFFFF;
      --surface: #FFFFFF;
      --card-base: #F5F6F8;
      --text-primary: #22201E;
      --text-secondary: #645B4C;
      --text-muted: #8E887E;
      --line: #ECEEF2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      background: #E7EBF1;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 9:16 폰 화면 틀 (최대 너비 430px, 높이 100dvh) */
    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      background: var(--bg-page);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 480px) {
      .phone-frame {
        height: min(92dvh, 860px);
        aspect-ratio: 9 / 16;
        border-radius: 38px;
        box-shadow:
          0 36px 84px rgba(17, 26, 40, 0.22),
          0 10px 28px rgba(17, 26, 40, 0.10),
          inset 0 0 0 1px rgba(255, 255, 255, 0.7);
      }
    }

    /* 배경 은은한 원형 빛 (오른쪽 위, 왼쪽 아래) */
    .bg-glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow--tr {
      display: none;
    }

    .bg-glow--bl {
      display: none;
    }

    /* 상단 바 */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(16px + env(safe-area-inset-top)) 22px 18px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .top-bar > * {
      pointer-events: auto;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(20, 24, 32, 0.08);
      background: #FFFFFF;
      box-shadow: 0 4px 12px rgba(17, 26, 40, 0.07);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .back-btn:active {
      transform: scale(0.92);
      box-shadow: 0 2px 6px rgba(17, 26, 40, 0.06);
    }

    .top-title {
      text-align: right;
      line-height: 1.25;
    }

    .top-title__ko {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .top-title__en {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      color: var(--accent-text);
      margin-right: -0.32em;
    }

    /* 카드 영역만 세로 스크롤, 스크롤바 숨김 */
    .scroll-area {
      position: relative;
      z-index: 10;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: calc(84px + env(safe-area-inset-top)) 20px calc(92px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    /* 명함 카드 */
    .card {
      position: relative;
      width: 100%;
      max-width: 372px;
      border-radius: 30px;
      background: var(--card-base);
      padding-bottom: 12px;
      box-shadow:
        0 28px 60px rgba(26, 38, 57, 0.16),
        0 8px 20px rgba(26, 38, 57, 0.06);
      overflow: hidden;
      opacity: 0;
      transform: translateY(72px);
      animation: cardRise 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardRise {
      0% {
        opacity: 0;
        transform: translateY(72px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 흰 빛줄기 스쳐 지나가는 애니메이션 (0.7초 후 시작, 2.1초) */
    .card::after {
      content: "";
      position: absolute;
      top: -30%;
      left: -85%;
      width: 55%;
      height: 160%;
      background: linear-gradient(
        105deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.36) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-22deg);
      pointer-events: none;
      z-index: 30;
      animation: lightSweep 2.1s ease-in-out 0.7s 1 forwards;
    }

    @keyframes lightSweep {
      0% {
        left: -85%;
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        left: 145%;
        opacity: 0;
      }
    }

    /* 1) 헤더 밴드 */
    .card-band {
      position: relative;
      height: 168px;
      padding: 26px 24px 0;
      background: var(--main);
      overflow: hidden;
    }

    .band-glow {
      display: none;
    }

    .band-title {
      position: relative;
      z-index: 2;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .band-subtitle {
      position: relative;
      z-index: 2;
      margin-top: 6px;
      font-size: 9.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.44em;
      color: rgba(34, 32, 30, 0.72);
    }

    /* 2) 흰 시트 */
    .card-sheet {
      position: relative;
      margin: -38px 11px 0;
      padding: 62px 20px 18px;
      background: var(--surface);
      border-radius: 25px;
      box-shadow: 0 12px 32px rgba(26, 38, 57, 0.08);
      z-index: 3;
    }

    /* 3) 프로필 사진 */
    .avatar-wrap {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #FFFFFF;
      background: #E5E8EE;
      box-shadow: 0 10px 24px rgba(26, 38, 57, 0.16);
      overflow: hidden;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    /* 4) 이름 & 직함/한 줄 소개 */
    .profile-header {
      text-align: center;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .profile-meta {
      margin-top: 6px;
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .profile-role {
      color: var(--accent-text);
      font-weight: 700;
    }

    /* 5) 액션 버튼 4개 (4칸 그리드) */
    .actions-grid {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-primary);
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .action-box {
      width: 51px;
      height: 51px;
      border-radius: 15px;
      background: var(--accent-soft);
      border: 1px solid rgba(252, 175, 23, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .action-item:active .action-box {
      transform: scale(0.93);
      background: var(--main);
      border-color: var(--main);
    }

    .action-label {
      margin-top: 7px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* 6) 가는 구분선 1px */
    .divider {
      height: 1px;
      background: var(--line);
      margin: 22px 0 6px;
    }

    /* 7) 정보 리스트 */
    .info-list {
      list-style: none;
    }

    .info-row {
      padding: 13px 2px;
      border-bottom: 1px solid var(--line);
    }

    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 4px;
    }

    .info-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .info-value {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.45;
      text-decoration: none;
      word-break: break-word;
    }

    .info-value--link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: color 0.15s ease;
    }

    .info-value--link:active {
      color: var(--accent);
    }

    .info-arrow {
      color: var(--text-muted);
      flex-shrink: 0;
      margin-left: 8px;
    }

    .info-line-strong {
      font-weight: 700;
    }

    /* 공유 버튼 (오른쪽 아래 고정, 지름 54px 원형, 1.2초 뒤 아래에서 떠오름) */
    .share-fab {
      position: absolute;
      right: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 30;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: var(--main);
      color: var(--text-primary);
      box-shadow:
        0 12px 24px rgba(34, 32, 30, 0.18),
        0 4px 10px rgba(34, 32, 30, 0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: translateY(36px);
      animation: fabRise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .share-fab:active {
      transform: scale(0.92);
    }

    @keyframes fabRise {
      0% {
        opacity: 0;
        transform: translateY(36px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 토스트 메시지 */
    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(86px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(14px);
      z-index: 40;
      background: rgba(20, 24, 32, 0.92);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease, transform 0.24s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

    <div class="bg-glow bg-glow--tr" aria-hidden="true"></div>
    <div class="bg-glow bg-glow--bl" aria-hidden="true"></div>

    <!-- 상단 바 -->

      <button type="button" class="back-btn" id="backBtn" aria-label="뒤로가기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <div class="top-title">
        <span class="top-title__ko">명함</span>
        <span class="top-title__en">BUSINESS CARD</span>

    <!-- 카드 스크롤 영역 -->
    <main class="scroll-area" id="scrollArea">
      <article class="card">
        <!-- 1) 헤더 밴드 -->

          <div class="band-glow band-glow--2" aria-hidden="true"></div>

  <script>
    (function () {
      const toastEl = document.getElementById('toast');
      const backBtn = document.getElementById('backBtn');
      const saveBtn = document.getElementById('saveContactBtn');
      const shareBtn = document.getElementById('shareBtn');
      const scrollArea = document.getElementById('scrollArea');
      let toastTimer = null;

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('is-visible');
        }, 2400);
      }

      // 뒤로가기 버튼
      backBtn.addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          scrollArea.scrollTo({ top: 0, behavior: 'smooth' });
          showToast('이전 페이지가 없습니다');
        }
      });

      // vCard(.vcf) 다운로드
      saveBtn.addEventListener('click', () => {
        const vcardLines = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          'N:김;현미;;;',
          'FN:김현미',
          'TITLE:TA코치',
          'TEL;TYPE=CELL:010-3329-2486',
          'EMAIL;TYPE=INTERNET:3261076@kbinsure.com',
          'NOTE:정신이 육체를 지배한다!!',
          'END:VCARD'
        ].join('\r\n');

        const blob = new Blob([vcardLines], { type: 'text/vcard;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = '김현미_명함.vcf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        showToast('연락처가 저장되었습니다');
      });

      // 클립보드 복사 (fallback 포함)
      function copyUrlFallback(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast('명함 주소가 복사되었습니다');
        } catch (err) {
          showToast('주소를 복사할 수 없습니다');
        }
        document.body.removeChild(textarea);
      }

      // 공유 버튼
      shareBtn.addEventListener('click', async () => {
        const shareData = {
          title: '김현미 | TA코치 디지털 명함',
          text: '김현미 (TA코치) · 정신이 육체를 지배한다!!',
          url: window.location.href
        };

        if (navigator.share) {
          try {
            await navigator.share(shareData);
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(window.location.href);
            showToast('명함 주소가 복사되었습니다');
            return;
          } catch (err) {
            // fallback below
          }
        }

        copyUrlFallback(window.location.href);
      });
    })();
  </script>
